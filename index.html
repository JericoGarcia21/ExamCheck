<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="ExamCheck — teacher-focused exam paper checking. Capture, grade and export results faster." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ExamCheck" />
    <style>html{background:#f8fafc}body{margin:0}.app-splash{box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif;text-align:center}.app-splash img{width:80px;height:80px;border-radius:20px;box-shadow:0 12px 28px #2563eb26}.app-splash h1{margin:24px 0 8px;font-size:30px;font-weight:700;letter-spacing:-1px}.app-splash p{margin:0;color:#64748b;font-size:14px}.app-splash-loader{width:24px;height:24px;margin-top:32px;border:2px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:splash-spin 1s linear infinite}@keyframes splash-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.app-splash-loader{animation:none;border-color:#2563eb}}</style>
    <title>ExamCheck</title>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite">
        <img src="/favicon.svg" alt="" width="80" height="80" />
        <h1>ExamCheck</h1>
        <p>More time for teaching.</p>
        <span class="app-splash-loader" aria-hidden="true"></span>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Loading ExamCheck</span>
      </div>
    </div>
    <noscript>Enable JavaScript to use ExamCheck.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
